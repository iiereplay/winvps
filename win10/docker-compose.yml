services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "tiny10"
      USERNAME: "Tlgx"
      PASSWORD: "tlgx@123"
      RAM_SIZE: "3G"
      CPU_CORES: "2"
      DISK_SIZE: "20G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - win10-data:/storage
    stop_grace_period: 2m

volumes:
  win10-data:
